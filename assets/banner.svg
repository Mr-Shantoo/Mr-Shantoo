<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">MD. MINE UDDIN / MR-SHANTOO — CASE FILES</title>
  <desc id="desc">DETECTION SYSTEMS / IoT · ML · SECURITY. A quiet skyline in rain, with an empty rooftop signal beam.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#12161b"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#F5C400" stop-opacity=".03"/>
      <stop offset=".7" stop-color="#F5C400" stop-opacity=".12"/>
      <stop offset="1" stop-color="#F5C400" stop-opacity=".02"/>
    </linearGradient>
    <radialGradient id="cloud">
      <stop stop-color="#F5C400" stop-opacity=".12"/>
      <stop offset="1" stop-color="#F5C400" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="6"/></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .signal { opacity: .7; animation: pulse 6s ease-in-out infinite; }
    .rain path { animation: drift 8s linear infinite; }
    .rain path:nth-child(3n) { animation-delay: -2.7s; }
    .rain path:nth-child(3n + 1) { animation-delay: -5.3s; }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: .85; } }
    @keyframes drift { from { transform: translate(6px, -12px); } to { transform: translate(-6px, 12px); } }
    @media (prefers-reduced-motion: reduce) { .signal, .rain path { animation: none; } }
  </style>
