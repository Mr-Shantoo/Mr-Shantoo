<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 650" width="100%" role="img" aria-labelledby="title description">
  <title id="title">MD. MINE UDDIN / ENGINEERING</title>
  <desc id="description">I investigate what breaks. I build what lasts. SECURITY RESEARCH · APPLIED ML · SOFTWARE ENGINEERING. github.com/Mr-Shantoo. A wide, low-profile metallic bat insignia with subtle panel seams and a soft crimson shadow.</desc>
